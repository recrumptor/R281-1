name: Debug OpenWrt Ninja Build

on:
  workflow_dispatch:

env:
  OPENWRT_ROOT_PATH: workspace/openwrt

jobs:
  debug-ninja:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git libncurses5-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
            libpam0g-dev libtirpc-dev libev-dev liblzma-dev libsnmp-dev

      - name: Setup OpenWrt Source
        run: |
          # Вставь сюда логику клонирования/подготовки исходников OpenWrt, если она отличается
          # Например, если ты клонируешь исходники через скрипт:
          mkdir -p $OPENWRT_ROOT_PATH
          # Если OpenWrt лежал в корне или скачивается скриптом:
          if [ ! -f "$OPENWRT_ROOT_PATH/Makefile" ]; then
            git clone https://git.openwrt.org/openwrt/openwrt.git $OPENWRT_ROOT_PATH
          fi

      - name: Update and Install Feeds
        run: |
          cd $OPENWRT_ROOT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Configuration
        run: |
          # Применяем твои конфиги
          if [ -f "./config/config.seed" ]; then
            cp ./config/config.seed $OPENWRT_ROOT_PATH/.config
          fi
          cd $OPENWRT_ROOT_PATH
          make defconfig

      - name: Compile Ninja Only (Verbose Output)
        run: |
          cd $OPENWRT_ROOT_PATH
          # Компилируем только host tools и конкретно ninja в 1 поток
          make tools/ninja/compile -j1 V=s
