name: Build OpenWrt Firmware5

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt Version (git tag on openwrt/openwrt, e.g. 24.10.8)"
        type: string
        required: true
        default: "24.10.8"
      config_file:
        description: "Config Name"
        type: choice
        required: true
        options:
          - openwrt.config
      config_link:
        description: "Use Config URL"
        type: boolean
        default: false
      config_url:
        description: "Config URL"
        type: string
        required: false
        default: ""
      diy:
        description: "DIY Script"
        type: choice
        required: true
        options:
          - diy_v1.sh
          - diy_v2.sh
      firmware_release:
        description: "Firmware Release"
        type: boolean
        default: false
      vermagic:
        description: "Replace Vermagic"
        type: boolean
        default: true
      vermagic_opt:
        description: "Use SNAPSHOT Vermagic"
        type: boolean
        default: false

env:
  SOURCE_URL: https://github.com/openwrt/openwrt
  OPENWRT_VERSION: ${{ github.event.inputs.version }}
  PATCH_DIR: patches/notion-r281
  FEEDS_SH: feeds.sh
  FEEDS_PKG_SH: feeds_pkg.sh
  CONFIG_FILE: ${{ github.event.inputs.config_file }}
  CONFIG_LINK: ${{ github.event.inputs.config_link }}
  CONFIG_URL: ${{ github.event.inputs.config_url }}
  DIY_SH: ${{ github.event.inputs.diy }}
  FIRMWARE_RELEASE: ${{ github.event.inputs.firmware_release }}
  VERMAGIC: ${{ github.event.inputs.vermagic }}
  VERMAGIC_OPT: ${{ github.event.inputs.vermagic_opt }}
  TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TZ: UTC

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
      - name: Initialize Environment
        run: |
          sudo timedatectl set-timezone "$TZ"
          mkdir -p workspace
          df -hT
          ulimit -n 8192

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: '4096'
          temp-reserve-mb: '2048'
          swap-size-mb: '2048'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison \
            btrfs-progs build-essential bzip2 ca-certificates ccache cmake coreutils \
            cpio curl device-tree-compiler fastjar flex g++-multilib gawk gcc-multilib \
            gettext git git-core gperf gzip haveged help2man intltool jq libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libsigsegv2 libssl-dev libtool libz-dev lrzsz m4 mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pigz pkgconf python3 python3-pip python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools swig tar texinfo \
            uglifyjs unzip upx upx-ucl vim wget xmlto xsltproc xxd xz-utils yasm zip \
            zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Determine Target & Subtarget
        id: target_info
        run: |
          if [[ "$CONFIG_LINK" == "true" && -n "$CONFIG_URL" ]]; then
            curl -fsSL "$CONFIG_URL" -o temp.config
          else
            cp ./config/$CONFIG_FILE temp.config
          fi
          
          DEVICE_TARGET=$(grep 'CONFIG_TARGET_BOARD' temp.config | awk -F '"' '{print $2}')
          DEVICE_SUBTARGET=$(grep 'CONFIG_TARGET_SUBTARGET' temp.config | awk -F '"' '{print $2}')
          
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
          rm temp.config

      - name: Download & Extract Prebuilt Official OpenWrt SDK
        run: |
          cd workspace
          BASE_URL="https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"
          SDK_FILE=$(curl -fsSL "$BASE_URL/" | grep -oP 'openwrt-sdk-[^"]+\.tar\.(zst|xz)' | head -n1)
          
          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: Could not find SDK at $BASE_URL/"
            exit 1
          fi
          
          echo "Downloading $SDK_FILE..."
          curl -fL --retry 5 -o "/tmp/$SDK_FILE" "$BASE_URL/$SDK_FILE"
          
          mkdir -p openwrt
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf "/tmp/$SDK_FILE" -C openwrt --strip-components=1 ;;
            *.tar.xz)  tar -xf "/tmp/$SDK_FILE" -C openwrt --strip-components=1 ;;
          esac
          
          cd openwrt
          echo "OPENWRT_ROOT_PATH=$PWD" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y-%m-%d-%H%M')" >> $GITHUB_ENV

      - name: Apply Notion R281 Patches
        run: |
          cd $OPENWRT_ROOT_PATH
          for p in $GITHUB_WORKSPACE/$PATCH_DIR/*.patch; do
            if [ -f "$p" ]; then
              echo "Applying $(basename "$p")"
              patch -p1 < "$p" || git apply "$p"
            fi
          done

      - name: Load Custom Feeds
        run: |
          [ -f "./scripts/$FEEDS_SH" ] && cp ./scripts/$FEEDS_SH $OPENWRT_ROOT_PATH/$FEEDS_SH
          cd $OPENWRT_ROOT_PATH
          
          ./scripts/feeds update -a
          if [ -f "./$FEEDS_SH" ]; then
            chmod +x ./$FEEDS_SH && ./$FEEDS_SH
            ./scripts/feeds update -a
          fi
          
          if [ -f "$GITHUB_WORKSPACE/scripts/$FEEDS_PKG_SH" ]; then
            cp $GITHUB_WORKSPACE/scripts/$FEEDS_PKG_SH $OPENWRT_ROOT_PATH/$FEEDS_PKG_SH
            chmod +x ./$FEEDS_PKG_SH && ./$FEEDS_PKG_SH
            ./scripts/feeds update -a
          fi
          
          ./scripts/feeds install -a

      - name: Load Configuration & Setup Vermagic
        run: |
          set -e
          cd $OPENWRT_ROOT_PATH
          
          if [[ "$CONFIG_LINK" == "true" && -n "$CONFIG_URL" ]]; then
            curl -fsSL "$CONFIG_URL" -o .config
          else
            cp $GITHUB_WORKSPACE/config/$CONFIG_FILE .config
          fi
          
          if [[ "$VERMAGIC_OPT" == "true" ]]; then
            version="${OPENWRT_VERSION}-SNAPSHOT"
          else
            version="${OPENWRT_VERSION}"
          fi
          
          kmods=$(curl -s "https://downloads.openwrt.org/releases/${version}/targets/${DEVICE_TARGET}/${DEVICE_SUBTARGET}/kmods/" \
            | grep -oP '<td class="n"><a href="\K[^/]+|<td class="d">\K[^<]+' \
            | paste -d '|' - - | sort -t '|' -k2 | head -n1 | cut -d '|' -f1)
            
          grep -q '^CONFIG_VERSION_REPO=' .config \
            && sed -i "s|^CONFIG_VERSION_REPO=.*|CONFIG_VERSION_REPO=\"https://downloads.openwrt.org/releases/${version}\"|" .config \
            || echo -e "\nCONFIG_VERSION_REPO=\"https://downloads.openwrt.org/releases/${version}\"" >> .config
            
          if [[ "$VERMAGIC" == "true" ]]; then
            echo "$kmods" | sed 's/.*-//' > .vermagic
            [ -f ./include/kernel-defaults.mk ] && sed -i -e 's/^\(.\).*vermagic$/\1cp $(TOPDIR)\/.vermagic $(LINUX_DIR)\/.vermagic/' ./include/kernel-defaults.mk
          fi
          
          make defconfig
          echo "DEVICE_NAME=$(grep 'CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')" >> $GITHUB_ENV

      - name: Load DIY Scripts
        run: |
          cd $OPENWRT_ROOT_PATH
          if [ -f "$GITHUB_WORKSPACE/scripts/$DIY_SH" ]; then
            cp "$GITHUB_WORKSPACE/scripts/$DIY_SH" ./
            [ -d "$GITHUB_WORKSPACE/custom" ] && cp -r "$GITHUB_WORKSPACE/custom" ./
            chmod +x ./$DIY_SH && ./$DIY_SH
          fi

      - name: Download Source Tarballs
        run: |
          cd $OPENWRT_ROOT_PATH
          make download -j8 SHELL=/bin/bash
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Packages
        run: |
          cd $OPENWRT_ROOT_PATH
          echo "Building packages..."
          
          make buildinfo
          make diffconfig buildversion feedsversion
          
          # 1. Принудительно собираем Lua до вызова остальных пакетов
          make package/utils/lua/compile -j1 V=s

          # 2. Основная сборка с выводом подробного лога в случае падения (без IGNORE_ERRORS)
          make package/compile -j$(($(nproc) + 1)) BUILD_LOG=1 SHELL=/bin/bash || \
          make package/compile -j1 V=s SHELL=/bin/bash

          # 3. Индексация OPKG
          make package/index

      - name: Generate Firmware
        run: |
          cd $OPENWRT_ROOT_PATH
          make package/install -j$(($(nproc) + 1)) SHELL=/bin/bash || make package/install -j1 V=s SHELL=/bin/bash
          make target/install -j$(($(nproc) + 1)) SHELL=/bin/bash || make target/install -j1 V=s SHELL=/bin/bash
          make json_overview_image_info
          make checksum

      - name: Upload Bin To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          path: ${{ env.OPENWRT_ROOT_PATH }}/bin
          retention-days: 7

      - name: Deploy Files To Release
        if: ${{ env.FIRMWARE_RELEASE == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ env.TOKEN }}
          name: OpenWrt_${{ env.OPENWRT_VERSION }}_${{ env.DEVICE_NAME }}
          tag: release_${{ env.OPENWRT_VERSION }}_${{ env.BUILD_DATE }}
          artifacts: ${{ env.OPENWRT_ROOT_PATH }}/bin/targets/${{ env.DEVICE_TARGET }}/${{ env.DEVICE_SUBTARGET }}/*
          replacesArtifacts: true
          allowUpdates: true
          prerelease: false
